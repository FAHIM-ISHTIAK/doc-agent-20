name: security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v1
      - run: pip install pip-audit bandit
      # requirements.lock is the committed audit export of the canonical uv.lock.
      - run: pip-audit -r requirements.lock || true  # dependency CVEs
      - run: bandit -r src -q                          # code security
