# Stage 0 — fixed project statement carried forward from A1.
group_id: "20"
project_name: "Bangla Morphological Analyzer"
domain: "bangla-grammar-morphology"
real_user: "secondary-level Bangla teacher and SSC/Dakhil student"
task: >-
  Given a scanned page image from the declared Bangla grammar corpus, answer a
  morphology question from the page text and preserve the document/page evidence
  needed for a citation.

data_speciality: "bangla"
data_speciality_detail: >-
  Bangla conjuncts, dependent vowel signs, hasanta, reph, nukta, Bengali digits,
  punctuation, and rule notation make OCR errors semantically significant.

primary_nfr: "explainable"
nfr_target: "rule attribution coverage >= 0.90"
supporting_nfr_targets:
  citation_coverage: 1.0
  hop_trail_completeness: 1.0
  explanation_faithfulness: 0.85

success_metric: "answer-F1"
success_target: 0.70

corpus:
  min_pages: 300
  min_words: 60000
  pages: 783
  words: 0
  words_status: "pending measured OCR in A2"
  path: "data/raw/"
  source_url: "https://archive.org/details/in.ernet.dli.2015.457377"
  source_urls:
    - "https://archive.org/details/in.ernet.dli.2015.457377"
    - "https://nctb.gov.bd/pages/static-pages/695b99afc4774958d7b70612"
  license: "link-only educational/research use; see data/provenance.md"
  documents:
    - doc_id: "bhasha_prakash_1942"
      title: "Bhasha-prakash Bangala Byakaran, 2nd edition"
      year: 1942
      pages: 565
      split: "train"
      source_url: "https://archive.org/download/in.ernet.dli.2015.457377/2015.457377.Bhasha-prakash-Bangala.pdf"
    - doc_id: "nctb_bangla_grammar_2026"
      title: "Bangla Grammar, Classes 9–10"
      year: 2026
      pages: 218
      split: "test"
      source_url: "https://nctb.gov.bd/pages/static-pages/695b99afc4774958d7b70612"

corpus_revision_from_a1: >-
  A1 named the 2019 NCTB edition. A2 uses the team's available 2026 218-page
  edition instead. This change must be disclosed in the A2 form and approved by
  the instructor; the success metric and three project axes remain unchanged.
