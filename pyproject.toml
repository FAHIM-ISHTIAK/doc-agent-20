[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3.0",
  "torch>=2.2,<2.11",
  "lightning>=2.2,<3.0",
  "transformers>=4.57.6,<5.0",
  "timm>=1.0,<2.0",
  "datasets>=2.19,<5.0",
  "torchmetrics>=1.3,<2.0",
  "sentence-transformers>=2.7,<6.0",
  "faiss-cpu>=1.8,<2.0",
  "gymnasium>=0.29,<2.0",
  "fastapi>=0.111,<1.0",
  "gradio>=4.31,<7.0",
  "wandb>=0.17,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.2,<3.0",
  "pymupdf>=1.24,<1.27",
  "pillow>=10.3,<12.0",
  "easyocr>=1.7.2,<1.8",
  "accelerate>=1.14,<2.0",
  "qwen-vl-utils>=0.0.14,<0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.4,<1.0", "black>=24.4,<27.0", "mypy>=1.10,<2.0", "pytest>=8.2,<10.0", "pre-commit>=3.7,<5.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]
[tool.ruff.lint]
select = ["E","F","I","N","B","UP"]
# Fixed scaffold modules intentionally retain locked `from contracts import *`
# interfaces and several explanatory long lines until their later milestones.
# Enforce all actionable checks while avoiding false positives from that skeleton.
ignore = ["E501", "E702", "F405", "N812"]
[tool.black]
line-length = 100
extend-exclude = "notebooks"
[tool.mypy]
python_version = "3.12"
# Later fixed-home stubs deliberately retain their instructor-provided public
# signatures until their assigned milestone. Check typed code while allowing
# those interfaces to remain untyped for now.
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped", "override"]
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
